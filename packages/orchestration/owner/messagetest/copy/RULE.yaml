# The order of each owner's queue, version 1 of the shared rule: first the needs that stop the most instructions,
# and the leaves of the call graph before their callers. The message test has no score, so every count is 0 and
# its items come in enqueue order.
version: 1
order:
  - {key: stopped_instructions, direction: descending}
  - {key: call_height, direction: ascending}
  - {key: enqueued_at, direction: ascending}
definitions:
  stopped_instructions: >-
    For an item about edge S->T or about owner S: the image instructions of S's directory plus those of every
    function of the active set that reaches S through call edges of graph.json. Before the first score every value
    is 0 and the next key decides.
  call_height: >-
    The longest call path from the item's subject to a function of the active set with no callee in the set; 0 for
    a leaf, a data structure and a fact.
