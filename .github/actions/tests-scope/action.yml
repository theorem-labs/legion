name: Tests scope
description: >-
  Says which steps of the Tests workflow (pr-and-main.yaml) a pull request's changes can reach, as
  the outputs `orchestration` and `other` (.github/scripts/tests-scope.sh says what each covers and
  why each path selects what it does). On a pull request it reads the files the pull request's merge
  commit changes against its first parent, the base branch's tip, so the checkout must hold both:
  fetch-depth 2. A push to main, a merge-queue run, or a merge commit without two parents selects
  everything. Needs the repository checked out.
outputs:
  orchestration:
    description: "'true' when the orchestration ledger's vet and tests must run"
    value: ${{ steps.scope.outputs.orchestration }}
  other:
    description: "'true' when every other expensive step must run"
    value: ${{ steps.scope.outputs.other }}
runs:
  using: composite
  steps:
    - name: Select the steps the changes can reach
      id: scope
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        # Everything the job log should read is printed on its own, never through the pipe to
        # GITHUB_OUTPUT: the runner refuses an output file line that is not key=value, and a
        # `::warning::` written into it failed the step instead of running every check.
        if [ "$EVENT" != pull_request ]; then
          echo "$EVENT runs every step."
          scope=$'orchestration=true\nother=true'
        elif ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
          echo "::warning::HEAD is not a pull request's merge commit with two parents; every step runs."
          scope=$'orchestration=true\nother=true'
        else
          git diff --name-only --no-renames 'HEAD^1' HEAD > "$RUNNER_TEMP/tests-scope-files"
          echo "The pull request changes $(wc -l < "$RUNNER_TEMP/tests-scope-files") file(s)."
          scope=$(.github/scripts/tests-scope.sh < "$RUNNER_TEMP/tests-scope-files")
        fi
        printf '%s\n' "$scope"
        printf '%s\n' "$scope" >> "$GITHUB_OUTPUT"
