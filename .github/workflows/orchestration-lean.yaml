name: orchestration-lean

# The declaration index's Lean exporter and the similarity gate: their tests compile Lean fixtures, so they run
# where a Lean toolchain is installed. The rest of packages/orchestration is tested by pr-and-main.yaml, where these
# tests skip for want of lake.
# Only the packages this job's `go test` loads start it: declindex and conceptgate, the declindex
# command, and the two packages they import (ledger, internal/testpg). A change to another
# package of packages/orchestration compiles nothing this job runs, and pr-and-main.yaml tests the
# whole module on every pull request that changes any file but the orchestration-only workflows
# (.github/scripts/tests-scope.sh says which). The go test runs in workspace mode, so go.work and
# the manifests of the other modules it binds move the versions it compiles (golang.org/x/sys,
# x/text).
on:
  pull_request:
    paths:
      - "packages/orchestration/declindex/**"
      - "packages/orchestration/conceptgate/**"
      - "packages/orchestration/cmd/declindex/**"
      - "packages/orchestration/ledger/**"
      - "packages/orchestration/internal/testpg/**"
      - "packages/orchestration/go.mod"
      - "packages/orchestration/go.sum"
      - "go.work"
      - "packages/daemon/go.mod"
      - "packages/envoy/go.mod"
      - ".github/workflows/orchestration-lean.yaml"
  push:
    branches:
      - main
    paths:
      - "packages/orchestration/declindex/**"
      - "packages/orchestration/conceptgate/**"
      - "packages/orchestration/cmd/declindex/**"
      - "packages/orchestration/ledger/**"
      - "packages/orchestration/internal/testpg/**"
      - "packages/orchestration/go.mod"
      - "packages/orchestration/go.sum"
      - "go.work"
      - "packages/daemon/go.mod"
      - "packages/envoy/go.mod"
      - ".github/workflows/orchestration-lean.yaml"

# A new push to a pull request cancels that pull request's still-running run here; outside
# pull_request the key is github.sha, so a push to main never drops the run that saves the Lean
# stage2 cache every pull request restores.
concurrency:
  group: orchestration-lean-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      postgres:
        # postgres:17 (17.11 when pinned), by its multi-platform index digest.
        image: mirror.gcr.io/library/postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # These move with the served trees' lean-toolchain.
      LEAN_FORK_REPOSITORY: https://github.com/theorem-labs/lean4
      LEAN_FORK_COMMIT: d71bb0c6d04adbb8e94adfdf8c0e3291bfeea831
      # The Lean tests skip without lake; here a missing toolchain fails them instead.
      DECLINDEX_REQUIRE_LEAN: "1"
      # The gate compiles proposals only in the Landlock and seccomp sandbox; here its tests must run, not skip.
      DECLINDEX_REQUIRE_SANDBOX: "1"
      # The gate's own Lean tests compile untrusted proposal source, so they run only where this is set: in a
      # disposable runner like this one, or a container.
      DECLINDEX_SANDBOX_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/orchestration/go.mod
          cache-dependency-path: packages/orchestration/go.sum
      - name: Install elan
        run: |
          curl --fail --location --silent --show-error https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf elan-x86_64-unknown-linux-gnu.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Restore and save are separate steps: the combined actions/cache saves only in its post step
      # at job end, so a pull-request run that a newer push cancels would lose a finished build.
      # The save runs directly after the build, on every miss, a pull request's included: a pull
      # request that has to build Lean can read its own copy on its next run, and the copy on main
      # is what every other pull request restores.
      - name: Restore Lean stage2
        id: lean-stage2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean4/build/release/stage2
          key: lean4-${{ env.LEAN_FORK_COMMIT }}-stage2-${{ runner.os }}-${{ runner.arch }}
      - name: Build Lean stage2
        if: steps.lean-stage2.outputs.cache-hit != 'true'
        run: packages/orchestration/declindex/e2e/build-lean.sh "$LEAN_FORK_REPOSITORY" "$LEAN_FORK_COMMIT" lean4
      - name: Save Lean stage2
        if: steps.lean-stage2.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean4/build/release/stage2
          key: ${{ steps.lean-stage2.outputs.cache-primary-key }}
      - name: Link tree Lean toolchain
        run: |
          elan toolchain link tree-lean lean4/build/release/stage2
          elan default tree-lean
          lean_version="$(lean --version)"
          printf '%s\n' "$lean_version"
          grep --fixed-strings "$LEAN_FORK_COMMIT" <<<"$lean_version"
      - name: Test the declaration index and the similarity gate with Lean
        working-directory: packages/orchestration
        run: |
          lean --version
          go test -count=1 ./declindex/... ./conceptgate/... ./cmd/declindex/...
